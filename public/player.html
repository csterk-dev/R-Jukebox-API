<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <title>Player</title>
</head>

<body>
  <header class="header-container">
    <div class="row">
      <img class="header-logo" src="/r_jukebox.png" alt="Player logo">
      <h1>R Jukebox</h1>
    </div>
  </header>

  <div class="iframe-container">
    <div class="iframe-header">
      <p>This is the player for the <span class="purple-highlight">R Jukebox</span>.</p>
      <p>To search and play videos, use <b>port 3000</b> instead.</p>
    </div>

    <!-- 1. The <iframe> (and video player) will replace this <div> tag. -->
    <div id="player"></div>
  </div>

  <script>
    // Function to get the videoId from the URL path
    function getVideoIdFromPath() {
      const path = window.location.pathname;
      const pathParts = path.split('/');
      return pathParts[pathParts.length - 1];
    }

    // Get the videoId from the URL path
    const videoId = getVideoIdFromPath();

    // Set the iframe source to embed the YouTube video
    if (!videoId) alert('Video ID is missing.') 
    else {

      // 2. This code loads the IFrame Player API code asynchronously.
      var tag = document.createElement('script');

      tag.src = "http://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // 3. This function creates an <iframe> (and YouTube player)
      //    after the API code downloads.
      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '390',
          width: '640',
          videoId: videoId,
          playerVars: {
            origin: "http://localhost:3001",
            'playsinline': 1
          },
          events: {
            'onReady': onPlayerReady,
            // 'onStateChange': onPlayerStateChange
          }
        });
      }

      // 4. The API will call this function when the video player is ready.
      function onPlayerReady(event) {
        console.log("I ran")
        event.target.playVideo();
      }

      // // 5. The API calls this function when the player's state changes.
      // //    The function indicates that when playing a video (state=1),
      // //    the player should play for six seconds and then stop.
      // var done = false;
      // function onPlayerStateChange(event) {
      //   if (event.data == YT.PlayerState.PLAYING && !done) {
      //     setTimeout(stopVideo, 6000);
      //     done = true;
      //   }
      // }
      // function stopVideo() {
      //   player.stopVideo();
      // }
    }
  </script>

</body>

</html>
