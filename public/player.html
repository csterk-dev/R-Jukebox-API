<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <title>Player</title>
</head>

<body>
  <header class="header-container">
    <div class="row">
      <img class="header-logo" src="/r_jukebox.png" alt="Player logo">
      <h1>R Jukebox</h1>
    </div>
  </header>

  <div class="iframe-container">
    <div class="iframe-header">
      <p>This is the player for the <span class="purple-highlight">R Jukebox</span>.</p>
      <p>To search and play videos, go to <b>192.168.1.16:3000</b> (RPI3), or <b>192.168.1.17</b> (RPI5) instead.</p>
    </div>

    <!-- 1. The <iframe> (and video player) will replace this <div> tag. -->
    <div id="player"></div>
  </div>

  <script>
    window.jukeboxPlayer = null;
    window.jukeboxPlayerReady = false;
    window.jukeboxPlayerError = null;

    window.jukeboxControl = {
      play: function() {
        window.jukeboxPlayer && window.jukeboxPlayer.playVideo();
      },
      pause: function() {
        window.jukeboxPlayer && window.jukeboxPlayer.pauseVideo();
      },
      seek: function(seconds) {
        window.jukeboxPlayer && window.jukeboxPlayer.seekTo(seconds, true);
      },
      setVolume: function(volume) {
        window.jukeboxPlayer && window.jukeboxPlayer.setVolume(volume);
      },
      unMute: function() {
        window.jukeboxPlayer && window.jukeboxPlayer.unMute();
      },
      getState: function() {
        return window.jukeboxPlayer ? window.jukeboxPlayer.getPlayerState() : -1;
      },
      getCurrentTime: function() {
        return window.jukeboxPlayer ? window.jukeboxPlayer.getCurrentTime() : 0;
      },
      getDuration: function() {
        return window.jukeboxPlayer ? window.jukeboxPlayer.getDuration() : 0;
      }
    };

    function getVideoIdFromPath() {
      const path = window.location.pathname;
      const pathParts = path.split("/");
      return pathParts[pathParts.length - 1];
    }

    const videoId = getVideoIdFromPath();

    if (!videoId) {
      alert("Video ID is missing.");
    } else {
      var tag = document.createElement("script");

      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;

      function onYouTubeIframeAPIReady() {
        const currentOrigin = window.location.protocol + "//" + window.location.host;

        player = new YT.Player("player", {
          height: "390",
          width: "640",
          videoId: videoId,
          playerVars: {
            origin: currentOrigin,
            playsinline: 1,
            enablejsapi: 1,
            controls: 1
          },
          events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
            onError: onPlayerError
          }
        });

        window.jukeboxPlayer = player;
      }

      function onPlayerReady(event) {
        console.log("Player is ready");
        window.jukeboxPlayerReady = true;
        event.target.unMute();
        event.target.playVideo();
        console.log("Player started");
      }

      function onPlayerStateChange(event) {
        window.jukeboxPlayerState = event.data;
        if (typeof window.notifyPlayerStateChange === "function") {
          window.notifyPlayerStateChange(event.data);
        }
      }

      function onPlayerError(event) {
        console.error("Player error:", event.data);
        window.jukeboxPlayerError = event.data;
      }
    }
  </script>

</body>

</html>
